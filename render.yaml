# Blueprint de Render: motor de datos (FastAPI + Pandas).
#
# Uso: en Render → New → Blueprint → seleccione este repositorio.
#
# La base de datos del historial ya NO se declara aquí: vive en Supabase, que
# no caduca a los 30 días como el PostgreSQL gratuito de Render. Sólo hay que
# pegar su cadena de conexión en `DATABASE_URL` (marcada `sync: false`, así que
# Render la pide al desplegar y nunca queda escrita en el repositorio).
#
# Cómo obtener esa cadena: docs/supabase.md
#
# Nota: el plan gratuito de un *servicio web* de Render no caduca; lo que
# caducaba a los 30 días era su PostgreSQL gratuito. El servicio sí se duerme
# tras 15 minutos sin tráfico y la primera petición tarda unos segundos.

services:
  - type: web
    name: motor-datos-inteligente
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/salud
    envVars:
      # Dominio del sitio de Netlify. Si usa un dominio propio, añádalo
      # separado por comas.
      - key: CORS_ORIGINS
        value: https://excelviewanddownloadtopdf.netlify.app

      # Cadena de conexión de Supabase. Use la del *pooler* (IPv4), no la
      # conexión directa: Render no tiene IPv6 y la directa no resolvería.
      #
      #   postgresql://postgres.<REF>:<CLAVE>@<REGION>.pooler.supabase.com:5432/postgres
      #
      # `sync: false` = Render la solicita en el panel al crear el blueprint.
      - key: DATABASE_URL
        sync: false

      - key: MAX_UPLOAD_BYTES
        value: "26214400"
      # Tamaño máximo de un archivo que se conserva en el historial.
      - key: MAX_BYTES_HISTORIAL
        value: "8388608"
      # Análisis guardados por navegador.
      - key: MAX_HISTORIAL
        value: "25"
