# Blueprint de Render: motor de datos + base de datos del historial.
#
# Uso: en Render → New → Blueprint → seleccione este repositorio. Render lee
# este archivo y crea ambos recursos ya conectados entre sí.
#
# La cadena de conexión se inyecta sola mediante `fromDatabase`: no hay que
# copiar ninguna credencial a mano ni pegarla en ningún sitio.
#
# Tras el primer despliegue queda un solo paso manual:
#   copiar la URL del servicio y ponerla en Netlify como BACKEND_URL.

services:
  - type: web
    name: motor-datos-inteligente
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/salud
    envVars:
      # Dominio del sitio de Netlify. Si usa un dominio propio, añádalo
      # separado por comas.
      - key: CORS_ORIGINS
        value: https://excelviewanddownloadtopdf.netlify.app

      # Conexión al Postgres de abajo. Render la resuelve al desplegar.
      - key: DATABASE_URL
        fromDatabase:
          name: historial-analisis
          property: connectionString

      - key: MAX_UPLOAD_BYTES
        value: "26214400"
      # Tamaño máximo de un archivo que se conserva en el historial.
      - key: MAX_BYTES_HISTORIAL
        value: "8388608"
      # Análisis guardados por navegador.
      - key: MAX_HISTORIAL
        value: "25"
      # El plan gratuito duerme el servicio tras 15 minutos sin tráfico; la
      # primera petición después tarda unos segundos en responder.

databases:
  - name: historial-analisis
    databaseName: historial
    user: motor
    plan: free
    region: oregon
    # AVISO: el Postgres gratuito de Render caduca 30 días después de crearse.
    # Pasado ese plazo hay 14 días de gracia para pasarlo a un plan de pago;
    # después Render lo borra con todos sus datos.
    #
    # Si el historial debe durar más, use un proveedor sin caducidad (por
    # ejemplo Neon, que es lo que hay detrás de Netlify DB): borre este bloque
    # `databases`, cambie el `fromDatabase` de arriba por
    #
    #   - key: DATABASE_URL
    #     sync: false        # se introduce a mano en el panel de Render
    #
    # y pegue allí la cadena de conexión del proveedor elegido.
